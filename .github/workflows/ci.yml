name: CI

# 触发：push 或 PR 到 main 分支
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint（ruff）
        run: ruff check arthas-api/

      - name: 单元测试（pytest）
        run: python -m pytest arthas-api/test_diagnose.py -v
